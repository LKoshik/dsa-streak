<!doctype html>
<html lang="en" data-theme="system">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#131f24">
  <meta name="description" content="DSA Streak: solve one problem a day.">
  <title>DSA Streak</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./favicon-64.png" type="image/png" sizes="64x64">
  <link rel="apple-touch-icon" href="./apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="DSA Streak">
  <link rel="stylesheet" href="./app.css">
</head>
<body>
  <div id="app"></div>
  <!-- Loading screen: a layer ABOVE #app, so the app can be built underneath and the screen fades away to reveal it.
       Styles: main.css (.splash). Timing, tap-to-skip and fade: src/ui/splash.js. -->
  <div id="splash" class="splash" role="status" aria-label="Loading DSA Streak">
    <img class="splash__logo" src="./icon-512.png" alt="" width="160" height="160" draggable="false">
    <p class="splash__name">DSA Streak</p>
  </div>
  <noscript>DSA Streak needs JavaScript.</noscript>
  <script type="module" src="./app.js"></script>
</body>
</html>
