# Deploys DSA Streak to GitHub Pages.
# Runs on every push to main, and by hand (Actions tab -> "Deploy to GitHub Pages" -> Run workflow).
# The deploy job only starts if the test job passed, so a failing test blocks the deploy.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# What the workflow is allowed to do with the repository and with Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time. A deploy that has already started is allowed to finish;
# a newer push waits for it instead of cancelling it half way.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install packages
        run: npm ci

      - name: Run the tests
        run: npm test

  deploy:
    # Does not start unless the test job finished green.
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install packages
        run: npm ci

      - name: Build the app (creates dist/)
        run: npm run build

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Package dist/ for Pages
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
